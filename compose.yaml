name: project15

services:
  database:
    image: postgres:15.19-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-project15}
      POSTGRES_USER: ${POSTGRES_USER:-project15}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER:-project15}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-project15}
      SECURITY_REPORTS_DIR: /app/security-reports
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    init: true
    ports:
      - "127.0.0.1:5000:8000"
    read_only: true
    restart: unless-stopped
    tmpfs:
      - /tmp

volumes:
  postgres_data:
